services:
  steam-mcp:
    build: .
    container_name: steam-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4100:4100"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
